version: "3.8"

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017/stock-app
    depends_on:
      - mongo

  frontend:
    build: ./dashboard
    ports:
      - "5173:80"